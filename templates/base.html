<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Законы Ньютона{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>

    <div class="stars"></div>
    <div class="stars stars2"></div>
    <div class="stars stars3"></div>

    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">⚛ Законы Ньютона</a>
        <div class="nav-links">
            <a href="{{ url_for('law1') }}">1-й закон</a>
            <a href="{{ url_for('law2') }}">2-й закон</a>
            <a href="{{ url_for('law3') }}">3-й закон</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Лекция по физике · 2 академических часа · © 2025</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
